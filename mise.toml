min_version = "2025.6.0"

[tools]
python = "3.12"
ruff = "latest"
"pipx:basedpyright" = "latest"

[settings]
idiomatic_version_file_enable_tools = ["python", "rust"]

[tasks.lint]
description = "Lint Python grammar definitions with Ruff"
run = "ruff check grammars test_cases"

[tasks."fmt:check"]
description = "Check maintained Python grammar formatting with Ruff"
run = "ruff format --check grammars/grammar_py_example.py test_cases/grammar_regex_root.py"

[tasks.typecheck]
description = "Check Python grammar definitions with basedPyright"
run = "basedpyright"

[tasks.syntax]
description = "Compile Python grammar definitions with Python 3.12"
run = "python -m compileall -q grammars test_cases"

[tasks."rust:build"]
description = "Build the locked Rust workspace"
run = "cargo build --workspace --locked"

[tasks."rust:fmt"]
description = "Check Rust workspace formatting"
run = "cargo fmt --all -- --check"

[tasks."rust:clippy"]
description = "Lint all Rust workspace targets with warnings denied"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks."target:prepare"]
description = "Build the bundled AFL++-instrumented forkserver target"
run = "afl-clang-fast test.c -o test"

[tasks."rust:test"]
description = "Test the locked Rust workspace with its instrumented target"
run = '''
if [ ! -x ./test ]; then
  echo >&2 "error: ./test is required by forksrv tests; build it with: mise run target:prepare"
  exit 1
fi
cargo test --workspace --locked
'''

[tasks."generator:smoke"]
description = "Generate a bounded corpus from the bundled Python grammar"
run = "cargo test --locked -p fuzzer --test generator_smoke"

[tasks.check]
description = "Run all Python and Rust checks"
depends = [
  "syntax",
  "lint",
  "fmt:check",
  "typecheck",
  "rust:build",
  "rust:fmt",
  "rust:clippy",
  "rust:test",
  "generator:smoke",
]
